<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zadarmo — Photography</title>
  <meta name="description" content="A minimal photography portfolio by Zadarmo">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32-next.png">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <header class="site-header">
    <h1 class="site-title">Zadarmo</h1>
  </header>

  <main class="gallery">
    <div class="gallery-item loading">
      <img data-src="https://cdn.jsdelivr.net/gh/zadarmo/zadarmo.github.io@main/photos/IMG_20260502_120331.jpg" data-full="https://cdn.jsdelivr.net/gh/zadarmo/zadarmo.github.io@main/photos/IMG_20260502_120331.jpg" alt="Photo">
    </div>
    <div class="gallery-item loading">
      <img data-src="/photos/222.jpg"
        data-full="/photos/222.jpg" alt="Photo">
    </div>
  </main>

  <!-- Lightbox -->
  <div class="lightbox-overlay">
    <img class="lightbox-image" src="" alt="Fullscreen photo">
    <button class="lightbox-close" aria-label="Close">✕</button>
    <button class="lightbox-nav lightbox-prev" aria-label="Previous">‹</button>
    <button class="lightbox-nav lightbox-next" aria-label="Next">›</button>
    <span class="lightbox-counter"></span>
    <span class="lightbox-exif"></span>
  </div>

  <footer class="site-footer">
    © 2024 ZADARMO — ALL RIGHTS RESERVED
  </footer>

  <script src="/js/exif.min.js"></script>
  <script src="/js/gallery.js"></script>
</body>
</html>
