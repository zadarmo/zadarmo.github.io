<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>走走停停</title>
  <meta name="description" content="走走停停 — 摄影作品集">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32-next.png">
  <link rel="stylesheet" href="/css/gallery.css">
  <link rel="stylesheet" href="/css/music.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>

  <header class="site-header">
    <div class="site-left">
      <h1 class="site-title">走走停停</h1>
      <div class="theme-tabs">
        <button class="theme-tab active" data-theme="gallery">📷 摄影</button>
        <button class="theme-tab" data-theme="music">🎵 音乐</button>
      </div>
    </div>
    <nav class="view-switcher">
      <button class="view-btn active" data-view="gallery" aria-label="Photos" title="瀑布视图">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      </button>
      <button class="view-btn" data-view="timeline" aria-label="Timeline" title="时间视图">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      </button>
      <button class="view-btn" data-view="map" aria-label="Map" title="位置视图">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      </button>
      <button class="view-btn" data-view="river" aria-label="Pro" title="专业模式">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      </button>
      <span class="view-divider"></span>
      <button class="view-btn theme-toggle" aria-label="Toggle theme">
        <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </nav>
  </header>

  <!-- Gallery View -->
  <div class="view view-gallery active">
  <div class="toolbar">
    <div class="sort-bar">
      <button class="sort-btn" data-sort="dateTime">时间</button>
      <button class="sort-btn" data-sort="focalLength">焦距</button>
      <button class="sort-btn" data-sort="fNumber">光圈</button>
      <button class="sort-btn" data-sort="exposureTime">快门</button>
      <button class="sort-btn" data-sort="iso">ISO</button>
    </div>
    <div class="filter-bar">
      <div class="filter-row">
        <span class="filter-label">国家</span>
        <div class="filter-tags" id="filter-country"></div>
      </div>
      <div class="filter-row">
        <span class="filter-label">地区</span>
        <div class="filter-tags" id="filter-region"></div>
      </div>
      <button class="reset-btn" id="reset-all">清空</button>
    </div>
  </div>
  <main class="gallery"></main>
  <footer class="site-footer">
    <script>document.write(new Date().getFullYear())</script> 走走停停 — ALL RIGHTS RESERVED
  </footer>
  </div>

  <!-- Map View -->
  <div class="view view-map">
    <div id="photo-map"></div>
  </div>

  <!-- River View -->
  <div class="view view-river">
    <div class="river-container" id="river-container"></div>
  </div>

  <!-- Timeline View -->
  <div class="view view-timeline">
    <div class="timeline-scroll" id="timeline-scroll"></div>
  </div>

  <!-- Music View -->
  <div class="view view-music">
    <div class="music-page">
      <!-- Hero -->
      <section class="music-hero">
        <div class="music-hero-bg"></div>
        <div class="music-hero-content">
          <h2 class="music-hero-title">🎧 我的音乐宇宙</h2>
          <p class="music-hero-sub">从 <strong>2017.10.3</strong> 开始，与网易云相伴 <strong>9</strong> 年</p>
          <div class="music-stats">
            <div class="music-stat">
              <span class="music-stat-num" data-target="18231">0</span>
              <span class="music-stat-label">首歌</span>
            </div>
            <div class="music-stat">
              <span class="music-stat-num" data-target="5148">0</span>
              <span class="music-stat-label">小时</span>
            </div>
            <div class="music-stat">
              <span class="music-stat-num" data-target="58">0</span>
              <span class="music-stat-label">种曲风</span>
            </div>
          </div>
        </div>
      </section>
      <!-- Annual Report Cards -->
      <section class="music-section">
        <h3 class="music-section-title">年度回忆</h3>
        <div class="music-cards" id="music-cards"></div>
      </section>
      <!-- Genre Evolution -->
      <section class="music-section">
        <h3 class="music-section-title">曲风品味进化史</h3>
        <p class="music-section-sub">2021 — 2025</p>
        <div class="genre-chart" id="genre-chart"></div>
        <p class="genre-summary" id="genre-summary"></p>
      </section>
      <!-- Footer -->
      <footer class="music-footer">
        <script>document.write(new Date().getFullYear())</script> 走走停停 — ALL RIGHTS RESERVED
      </footer>
    </div>
  </div>

  <!-- Lightbox -->
  <div class="lightbox-overlay">
    <img class="lightbox-image" src="" alt="Fullscreen photo">
    <button class="lightbox-close" aria-label="Close">✕</button>
    <button class="lightbox-nav lightbox-prev" aria-label="Previous">‹</button>
    <button class="lightbox-nav lightbox-next" aria-label="Next">›</button>
    <span class="lightbox-counter"></span>
    <span class="lightbox-exif"></span>
  </div>

  <!-- Vlog Gallery Entry (floating) -->
  <div class="vlog-entry vlog-entry--gallery" id="vlog-banner">
    <span class="vlog-entry-icon">▶</span>
    <div class="vlog-entry-info">
      <span class="vlog-entry-title">📹 新西兰旅行 Vlog</span>
      <span class="vlog-entry-subtitle">点击观看这趟旅程的视频记录</span>
    </div>
  </div>

  <!-- Vlog Player Overlay -->
  <div class="vlog-overlay" id="vlog-overlay">
    <div class="vlog-player">
      <button class="vlog-close" aria-label="Close">✕</button>
      <iframe id="vlog-iframe" src="" allowfullscreen frameborder="0" scrolling="no"></iframe>
    </div>
  </div>

  <script src="/js/exif.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
  <script src="/js/gallery.js"></script>
  <script src="/js/music.js"></script>
</body>
</html>
